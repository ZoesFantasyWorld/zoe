  <div class="header-inner">
    <a class="brand" href="index.html">Zoe's Fantasy World</a>

    <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
      <span class="menu-icon"></span>
    </button>
  </div>
</header>

  <div class="menu-inner">
    <nav class="menu-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>

    <div class="menu-contact">
      <span>(240) 555-0123</span>
      <span>info@zoesfantasyworld.com</span>
    </div>
  </div>
</div>


<main>
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">Schedule</p>
      <h1 class="display-title">Request your cleaning.</h1>
      <p class="page-intro">
        Submit your preferred details and confirm the appointment afterward.
      </p>
    </div>
  </section>

  <section class="section">
    <div class="container form-wrap">
      <form data-demo-form>
        <div class="form-grid">
          <div class="field">
            <label for="first-name">First Name</label>
            <input id="first-name" name="first-name" required>
          </div>

          <div class="field">
            <label for="last-name">Last Name</label>
            <input id="last-name" name="last-name" required>
          </div>

          <div class="field">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" required>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
          </div>

          <div class="field full">
            <label for="address">Service Address</label>
            <input id="address" name="address">
          </div>

          <div class="field">
            <label for="cleaning-type">Cleaning Type</label>
            <select id="cleaning-type" name="cleaning-type">
              <option>Standard Cleaning</option>
              <option>Deep Cleaning</option>
              <option>Move-In / Move-Out</option>
            </select>
          </div>

          <div class="field">
            <label for="frequency">Frequency</label>
            <select id="frequency" name="frequency">
              <option>One Time</option>
              <option>Weekly</option>
              <option>Every Two Weeks</option>
              <option>Monthly</option>
            </select>
          </div>

          <div class="field">
            <label for="bedrooms">Bedrooms</label>
            <select id="bedrooms" name="bedrooms">
              <option>1</option>
              <option>2</option>
              <option selected>3</option>
              <option>4</option>
              <option>5+</option>
            </select>
          </div>

          <div class="field">
            <label for="bathrooms">Bathrooms</label>
            <select id="bathrooms" name="bathrooms">
              <option>1</option>
              <option selected>2</option>
              <option>3</option>
              <option>4+</option>
            </select>
          </div>

          <div class="field">
            <label for="date">Preferred Date</label>
            <input id="date" name="date" type="date">
          </div>

          <div class="field">
            <label for="time">Preferred Time</label>
            <select id="time" name="time">
              <option>Morning</option>
              <option>Afternoon</option>
              <option>Evening</option>
            </select>
          </div>

          <div class="field full">
            <label>Add-On Services</label>
            <div class="checks">
              <label class="check-item"><input type="checkbox" name="addons" value="oven"> Inside Oven</label>
              <label class="check-item"><input type="checkbox" name="addons" value="fridge"> Inside Refrigerator</label>
              <label class="check-item"><input type="checkbox" name="addons" value="windows"> Interior Windows</label>
              <label class="check-item"><input type="checkbox" name="addons" value="laundry"> Laundry</label>
            </div>
          </div>

          <div class="field full">
            <label for="notes">Additional Information</label>
            <textarea id="notes" name="notes"></textarea>
          </div>
        </div>

        <button class="submit-button" type="submit">Request Cleaning</button>
        <p class="form-message" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>

</body>
</html>
